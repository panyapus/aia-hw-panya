<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stock P&L Dashboard</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#14181f;--mute:#5d6675;--line:#dfe3ea;--up:#0a7a43;--upbg:#dcf3e6;--down:#b3261e;--downbg:#fbe1de;--mix:#8a5a00;--mixbg:#fdf0cf;--accent:#2457d6;--bar:#3b6fe0;--bar2:#e0832f;--hover:#eef2fb}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0f13;--card:#171a21;--ink:#eceff4;--mute:#9aa4b5;--line:#2a2f3a;--up:#4ad08a;--upbg:#12301f;--down:#ff8b82;--downbg:#3a1815;--mix:#f2c256;--mixbg:#3a2e0c;--accent:#7ea2ff;--bar:#5b8cff;--bar2:#f0954a;--hover:#1f2430}}
:root[data-theme="dark"]{--bg:#0d0f13;--card:#171a21;--ink:#eceff4;--mute:#9aa4b5;--line:#2a2f3a;--up:#4ad08a;--upbg:#12301f;--down:#ff8b82;--downbg:#3a1815;--mix:#f2c256;--mixbg:#3a2e0c;--accent:#7ea2ff;--bar:#5b8cff;--bar2:#f0954a;--hover:#1f2430}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Sarabun","Noto Sans Thai",sans-serif}
.wrap{max-width:1680px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0}
h2{font-size:15px;margin:0 0 6px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.sub{color:var(--mute);font-size:13px}
button,select,input{font:inherit;color:inherit}
.btn{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0}
input[type=search],select{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.badge{display:inline-block;border-radius:6px;padding:1px 8px;font-size:12px;font-weight:600;white-space:nowrap}
.b-up{background:var(--upbg);color:var(--up)}.b-down{background:var(--downbg);color:var(--down)}.b-mix{background:var(--mixbg);color:var(--mix)}
.b-warn{background:var(--line);color:var(--mute)}
.up{color:var(--up)}.down{color:var(--down)}
a{color:var(--accent)}
/* ตารางสรุปหน้าแรก: 1 หุ้น = 1 แถว */
.tbl{border:1px solid var(--line);border-radius:12px;background:var(--card);overflow:hidden}
.tr{display:grid;grid-template-columns:150px 62px 84px 64px 64px 84px 64px 64px 66px minmax(240px,1fr);gap:8px;padding:10px 12px;align-items:center;border-bottom:1px solid var(--line)}
.tr:last-child{border-bottom:0}
.th{color:var(--mute);font-size:12px;font-weight:600;background:var(--bg)}
.th .s{cursor:pointer;user-select:none}
.th .s:hover{color:var(--accent)}
.tr.row{cursor:pointer}
.tr.row:hover,.tr.row:focus{background:var(--hover);outline:0}
.num{text-align:right;font-variant-numeric:tabular-nums}
.sym{font-size:17px;font-weight:700;color:var(--accent)}
.sumtxt{font-size:13px;line-height:1.45}
.sumtxt .src{display:block;color:var(--mute);font-size:11px;margin-top:2px}
/* หน้า Detail */
.exec{margin:12px 0}
.exec ul{margin:6px 0 0;padding-left:18px}
.exec li{margin:3px 0}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0}
.kpi .v{font-size:21px;font-weight:700;line-height:1.2}
.kpi div{font-size:13px}
.detail{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:12px;align-items:start}
.nums{display:grid;gap:10px;min-width:0;container-type:inline-size}
.charts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;align-content:start}
.chart{padding:10px 10px 8px}
.chart .u{font-weight:400;color:var(--mute);font-size:11px;letter-spacing:0}
.lg{display:flex;gap:14px;justify-content:center;font-size:11px;color:var(--mute);margin-top:2px}
.lg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px}
.chart h3{margin:0 0 4px;font-size:12px;text-align:center;letter-spacing:.03em}
svg{width:100%;height:auto;display:block}
svg text{fill:var(--mute);font-size:10px}
.tw{overflow-x:auto;padding:6px 8px}
table{border-collapse:collapse;width:100%;font-size:clamp(7px,1.4cqw,12.5px);font-variant-numeric:tabular-nums}
th,td{padding:3px .25em;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left;padding-left:.2em;padding-right:.6em}
td[title],th[title]{cursor:help}
td[title]:hover{background:var(--hover)}
th{color:var(--mute);font-weight:600}
tr.t td{font-weight:700}
details summary{cursor:pointer;color:var(--accent)}
details ul{margin:6px 0 0;padding-left:18px;font-size:13px}
.empty{padding:20px 8px;text-align:center;color:var(--mute);font-size:13px}
.tabs{display:flex;gap:6px}
.tab{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 14px;cursor:pointer}
.tab.on{background:var(--accent);border-color:var(--accent);color:#fff}
.calllink{font-size:12px;display:inline-block;margin-top:2px}
.gt td,.gt th{white-space:normal;text-align:left;vertical-align:top}
.gt td:first-child,.gt th:first-child{position:static;min-width:170px}
.chg{display:inline-block;border-radius:6px;padding:0 8px;font-size:12px;font-weight:600;white-space:nowrap}
.qa details{border:1px solid var(--line);border-radius:10px;background:var(--card);margin:6px 0;padding:8px 12px}
.qa summary{cursor:pointer;font-weight:600}
.qa summary .meta{font-weight:400;color:var(--mute);font-size:12px}
.qa .body{margin-top:8px;font-size:14px}
.qa .body p{margin:6px 0}
.qa .flag{font-size:12px;background:var(--mixbg);color:var(--mix);border-radius:6px;padding:2px 8px;display:inline-block}
.stack>.card{margin-bottom:12px}
@media (max-width:1100px){.detail{grid-template-columns:1fr}.sumtxt{grid-column:1/-1}.tr{grid-template-columns:130px 56px 80px 60px 60px 80px 60px 60px 64px}}
@media (max-width:820px){
 .charts{grid-template-columns:1fr}
 .th{display:none}
 .tr{grid-template-columns:1fr 1fr;gap:4px 12px}
 .tr>*{min-width:0}
 .tr .num::before{content:attr(data-l) " ";color:var(--mute);font-size:12px;float:left}
 .tr .hd{grid-column:1/-1}
 .detail{grid-template-columns:1fr}
 .kpis{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>
<div class="wrap">
 <div class="top">
  <div>
   <h1 id="title">Stock P&amp;L Dashboard</h1>
   <div class="sub" id="subtitle"></div>
  </div>
  <button class="btn" id="theme" type="button">โหมดสว่าง/มืด</button>
 </div>
 <div id="app"></div>
 <p class="sub" id="foot"></p>
</div>
<script>
const DATA = /*__DATA__*/null;
const rows = DATA.rows, notes = DATA.notes, adjRows = DATA.adj || [], calls = DATA.calls || [], psRows = DATA.ps || [], divRows = DATA.div || [];
const pOrd = p => { const m = /Q(\d)'(\d\d)/.exec(p); return m ? parseInt(m[2]) * 10 + parseInt(m[1]) : 0; };
const callsOf = sym => calls.filter(c => c.symbol === sym).sort((x, y) => pOrd(y.period) - pOrd(x.period));
const callPick = {};   // หุ้นที่ผู้ใช้เลือกดู call ย้อนหลัง
const callOf = sym => { const l = callsOf(sym); return l.find(c => c.period === callPick[sym]) || l[0]; };
const bySym = {};
rows.forEach(r => (bySym[r.symbol] = bySym[r.symbol] || []).push(r));
Object.values(bySym).forEach(a => a.sort((x, y) => x.period_end.localeCompare(y.period_end)));
const syms = Object.keys(bySym);
const globalLatest = rows.map(r => r.period_end).sort().pop();
const T = s => new Date(s + 'T00:00:00Z').getTime();
const DAY = 86400000;
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const fmt = (n, d = 1) => n == null ? '–' : (n / 1000).toLocaleString('en-US', {minimumFractionDigits: d, maximumFractionDigits: d});
const pct = (a, b) => (a == null || b == null || b === 0) ? null : (a - b) / Math.abs(b) * 100;
const fp = p => p == null ? '–' : (p > 0 ? '+' : '') + p.toFixed(1) + '%';
const cls = p => p == null ? '' : p >= 0 ? 'up' : 'down';
const ratio = (a, b) => b ? a / b * 100 : null;
const fr = p => p == null ? '–' : p.toFixed(1) + '%';

function prevYear(list, r) { return list.find(x => Math.abs(T(x.period_end) - (T(r.period_end) - 365 * DAY)) < 5 * DAY); }
function prevQ(list, r) { return list.find(x => { const d = T(r.period_end) - T(x.period_end); return d > 80 * DAY && d < 100 * DAY; }); }
const sga = r => r.selling + r.admin;
const other = r => r.ebt - (r.gross_profit - r.selling - r.admin - r.finance_cost);  // รายได้อื่น ค่าใช้จ่ายอื่น ส่วนแบ่งกำไร ฯลฯ

function drivers(a, b, n) {
  const items = [
    ['กำไรขั้นต้น', a.gross_profit - b.gross_profit],
    ['ค่าใช้จ่ายขาย', -(a.selling - b.selling)],
    ['ค่าใช้จ่ายบริหาร', -(a.admin - b.admin)],
    ['ต้นทุนการเงิน', -(a.finance_cost - b.finance_cost)],
    ['รายการอื่นในงบ (รายได้อื่น ค่าใช้จ่ายอื่น ส่วนแบ่งกำไร)', other(a) - other(b)],
    ['ภาษี', -(a.tax - b.tax)],
  ].sort((x, y) => Math.abs(y[1]) - Math.abs(x[1])).slice(0, n);
  return items.map(([k, v]) => `${k} ${v >= 0 ? '+' : '−'}${fmt(Math.abs(v), 0)}`).join(', ');
}
const adjUnit = a => a.unit || 'ล้านบาท';
const adjOf = (sym, period, unit = 'ล้านบาท') => adjRows.find(a => a.symbol === sym && a.period === period && adjUnit(a) === unit && a.adj_net_profit_mb !== '');
const adjNone = sym => adjRows.find(a => a.symbol === sym && a.adj_net_profit_mb === '');   // บริษัทไม่เปิดเผยกำไรปรับปรุง
const hasAdj = (sym, unit) => adjRows.some(a => a.symbol === sym && adjUnit(a) === unit && a.adj_net_profit_mb !== '');
const noteOf = (sym, period, topic) => notes.find(n => n.symbol === sym && n.period === period && n.topic === topic);

function analyse(sym) {
  const list = bySym[sym], cur = list[list.length - 1];
  const py = prevYear(list, cur), pq = prevQ(list, cur);
  const m = {
    revY: py && pct(cur.revenue, py.revenue), revQ: pq && pct(cur.revenue, pq.revenue),
    npY: py && pct(cur.net_profit, py.net_profit), npQ: pq && pct(cur.net_profit, pq.net_profit),
  };
  const known = [m.revY, m.revQ, m.npY, m.npQ].filter(v => v != null);
  const pos = known.filter(v => v > 0).length;
  const verdict = known.length < 4 ? ['ข้อมูลไม่ครบ', 'b-warn'] : pos === 4 ? ['ดี', 'b-up'] : pos === 0 ? ['แย่', 'b-down'] : ['ผสม', 'b-mix'];
  const cautions = [];
  if (m.npY != null && Math.abs(m.npY) > 100) cautions.push('% กำไร YoY สูงมากเพราะฐานปีก่อนต่ำ ควรดูจำนวนเงินประกอบ');
  if (cur.mapping_note) cautions.push('ต้นทุน/GPM จัดกลุ่มตามธุรกิจ (ดู tooltip ที่บรรทัด COGS) เทียบกับหุ้นทั่วไปไม่ได้');
  const aud = noteOf(sym, cur.period, 'ความเห็นผู้สอบบัญชี');
  if (aud && aud.note.includes('ข้อสังเกต')) cautions.push('ผู้สอบบัญชีให้ความเห็นแบบมีข้อสังเกต/เรื่องอื่น ควรอ่านรายงานผู้สอบบัญชี');
  const ex = noteOf(sym, cur.period, 'สรุปผู้บริหาร');
  if (ex && sym === 'TRUE') cautions.push('ข้อความ MD&A ที่ดึงจาก PDF ตกหล่น ต้องเทียบภาพหน้า PDF');
  return {sym, list, cur, py, pq, m, verdict, cautions, ex, stale: cur.period_end < globalLatest};
}

const state = {sector: 'ทั้งหมด', q: '', sort: 'npY', dir: -1};
const app = document.getElementById('app');
const COLS = [['sym', 'หุ้น'], ['per', 'งวด'], ['rev', 'รายได้ (ล้านบาท)'], ['revY', 'YoY'], ['revQ', 'QoQ'], ['np', 'กำไรสุทธิ (ล้านบาท)'], ['npY', 'YoY'], ['npQ', 'QoQ'], ['ver', 'สถานะ']];
const sortVal = (i, k) => ({sym: i.sym, per: i.cur.period_end, rev: i.cur.revenue, revY: i.m.revY, revQ: i.m.revQ, np: i.cur.net_profit, npY: i.m.npY, npQ: i.m.npQ,
  ver: ['ดี', 'ผสม', 'แย่', 'ข้อมูลไม่ครบ'].indexOf(i.verdict[0])})[k];

function renderSummary() {
  document.getElementById('title').textContent = 'สรุปผลประกอบการล่าสุด · Stock P&L';
  const items = syms.map(analyse);
  document.getElementById('subtitle').textContent = `${items.length} หุ้น · เทียบงวดเดียวกันปีก่อน (YoY) และไตรมาสก่อน (QoQ) · กดหัวคอลัมน์เพื่อเรียง กดแถวเพื่อดูรายละเอียด`;
  const sectors = ['ทั้งหมด', ...new Set(items.map(i => i.cur.sector))];
  app.innerHTML = '';
  const c = el('div', 'controls');
  const secSel = el('select'); secSel.setAttribute('aria-label', 'เลือก sector');
  sectors.forEach(s => { const o = el('option', null, esc(s === 'ทั้งหมด' ? 'ทุก sector' : s)); o.value = s; if (s === state.sector) o.selected = true; secSel.appendChild(o); });
  secSel.onchange = () => { state.sector = secSel.value; draw(); };
  c.appendChild(secSel);
  const q = el('input'); q.type = 'search'; q.placeholder = 'ค้นหาชื่อหุ้น'; q.value = state.q; q.oninput = () => { state.q = q.value; draw(); };
  c.appendChild(q);
  const cnt = el('span', 'sub'); c.appendChild(cnt);
  app.appendChild(c);
  const tbl = el('div', 'tbl'); app.appendChild(tbl);
  const rule = el('div', 'sub', 'ป้ายสถานะ: <b>ดี</b> = รายได้และกำไรสุทธิโตทั้ง YoY และ QoQ · <b>แย่</b> = ลดทั้งหมด · <b>ผสม</b> = ที่เหลือ · คอลัมน์สรุปมาจาก MD&amp;A ของบริษัท ไม่เดาสาเหตุเพิ่ม');
  rule.style.marginTop = '8px'; app.appendChild(rule);

  function draw() {
    tbl.innerHTML = '';
    const f = items.filter(i => (state.sector === 'ทั้งหมด' || i.cur.sector === state.sector) && i.sym.toLowerCase().includes(state.q.trim().toLowerCase()));
    f.sort((a, b) => {
      const x = sortVal(a, state.sort), y = sortVal(b, state.sort);
      if (x == null && y == null) return 0; if (x == null) return 1; if (y == null) return -1;
      return state.dir * (typeof x === 'string' ? x.localeCompare(y) : x - y);
    });
    cnt.textContent = `แสดง ${f.length} / ${items.length} หุ้น`;
    const head = el('div', 'tr th');
    COLS.forEach(([k, l]) => {
      const cell = el('div', (k === 'sym' || k === 'per' || k === 'ver') ? '' : 'num', `<span class="s">${esc(l)}${state.sort === k ? (state.dir < 0 ? ' ▼' : ' ▲') : ''}</span>`);
      cell.firstChild.onclick = () => { if (state.sort === k) state.dir *= -1; else { state.sort = k; state.dir = k === 'sym' ? 1 : -1; } draw(); };
      head.appendChild(cell);
    });
    head.appendChild(el('div', null, 'สรุปงบล่าสุด (จาก MD&amp;A)'));
    tbl.appendChild(head);
    if (!f.length) { tbl.appendChild(el('div', 'empty', 'ไม่พบหุ้นตามเงื่อนไข')); return; }
    f.forEach(i => {
      const r = el('div', 'tr row'); r.tabIndex = 0; r.setAttribute('role', 'link');
      const go = () => { location.hash = '#/' + i.sym; };
      r.onclick = e => { if (e.target.tagName !== 'A') go(); }; r.onkeydown = e => { if (e.key === 'Enter') go(); };
      const n = (l, v, p) => `<div class="num ${cls(p)}" data-l="${l}">${v}</div>`;
      const ex = i.ex;
      r.innerHTML =
        `<div class="hd"><div class="sym">${esc(i.sym)}</div><div class="sub">${esc(i.cur.name)}</div><div class="sub">${esc(i.cur.sector)}</div><a class="calllink" href="#/call/${esc(i.sym)}">Earning call ›</a></div>` +
        `<div>${esc(i.cur.period)}${i.stale ? '<div class="sub">ยังไม่ประกาศงวดล่าสุด</div>' : ''}</div>` +
        `<div class="num" data-l="รายได้">${fmt(i.cur.revenue)}</div>${n('รายได้ YoY', fp(i.m.revY), i.m.revY)}${n('รายได้ QoQ', fp(i.m.revQ), i.m.revQ)}` +
        `<div class="num" data-l="กำไรสุทธิ">${fmt(i.cur.net_profit)}</div>${n('กำไร YoY', fp(i.m.npY), i.m.npY)}${n('กำไร QoQ', fp(i.m.npQ), i.m.npQ)}` +
        `<div><span class="badge ${i.verdict[1]}">${i.verdict[0]}</span></div>` +
        `<div class="sumtxt">${ex ? esc(ex.note) + `<span class="src">ที่มา: ${esc(ex.source_doc)} หน้า ${esc(ex.page)}</span>` : '<span class="sub">ยังไม่มีสรุปจาก MD&amp;A ของงวดนี้</span>'}</div>`;
      tbl.appendChild(r);
    });
  }
  draw();
}

/* ---------- กราฟ ---------- */
// สเกลแกนแบบ 1-2-2.5-5 ให้ตัวเลขบนแกนกลม ๆ (ครอบศูนย์เสมอ)
function niceScale(mn, mx, n = 4) {
  mn = Math.min(0, mn); mx = Math.max(0, mx);
  const raw = ((mx - mn) / n) || 1, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= raw - 1e-9);
  const lo = Math.floor(mn / step + 1e-9) * step, hi = Math.ceil(mx / step - 1e-9) * step, ticks = [];
  for (let v = lo; v <= hi + step / 2; v += step) ticks.push(Math.abs(v) < step / 1e6 ? 0 : v);
  return {lo, hi, ticks, step};
}
const W = 320, H = 190, PL = 48, PR = 10, PT = 16, PB = 34;
// ชื่อไตรมาส 2 บรรทัด (Q3 / '24)
const qLabel = (x, p) => `<text x="${x}" y="${H - 19}" text-anchor="middle" style="font-size:9.5px">${esc(p.slice(0, 2))}</text><text x="${x}" y="${H - 8}" text-anchor="middle" style="font-size:9.5px">${esc(p.slice(2))}</text>`;
function frame(periods, sc, fmtTick) {
  const y = v => PT + (H - PT - PB) * (sc.hi - v) / ((sc.hi - sc.lo) || 1);
  const gw = (W - PL - PR) / periods.length;
  let g = '';
  sc.ticks.forEach(t => { g += `<line x1="${PL}" x2="${W - PR}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)"${t === 0 ? '' : ' stroke-dasharray="2 3"'}/><text x="${PL - 5}" y="${y(t) + 3.5}" text-anchor="end">${fmtTick(t)}</text>`; });
  periods.forEach((p, i) => { g += qLabel(PL + gw * (i + 0.5), p); });
  return {g, y, gw, x: i => PL + gw * (i + 0.5)};
}
const legend = items => `<div class="lg">${items.map(s => `<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join('')}</div>`;
const mil = v => v == null ? null : v / 1000;

function barChart(title, series, periods) {
  const mills = series.map(s => s.values.map(mil));
  const peak = Math.max(...mills.flat().filter(v => v != null).map(Math.abs));
  const div = peak >= 10000 ? 1000 : 1, unit = div === 1000 ? 'พันล้านบาท' : 'ล้านบาท';  // ค่ามาก ๆ แสดงเป็นพันล้านบาท ให้ตัวเลขบนแท่งไม่ชนกัน
  const vals = mills.map(a => a.map(v => v == null ? null : v / div));
  const all = vals.flat().filter(v => v != null);
  const sc = niceScale(Math.min(...all), Math.max(...all));
  const dp = div === 1000 ? 1 : 0;
  const f = frame(periods, sc, v => v.toLocaleString('en-US', {maximumFractionDigits: sc.step < 1 ? 1 : 0}));
  let g = f.g;
  const bw = Math.min(24, (f.gw - 5) / series.length), one = series.length === 1;
  periods.forEach((p, i) => {
    series.forEach((s, k) => {
      const v = vals[k][i]; if (v == null) return;
      const x = f.x(i) - bw * series.length / 2 + k * bw, y0 = f.y(0), y1 = f.y(v);
      g += `<rect x="${x}" y="${Math.min(y0, y1)}" width="${bw - 1.5}" height="${Math.max(1, Math.abs(y1 - y0))}" rx="1.5" fill="${v < 0 ? 'var(--down)' : s.color}"><title>${esc(s.name)} ${esc(p)}: ${(v * div).toLocaleString('en-US', {maximumFractionDigits: 1})} ล้านบาท</title></rect>`;
      if (one) g += `<text x="${x + (bw - 1.5) / 2}" y="${v < 0 ? y1 + 10 : y1 - 3}" text-anchor="middle" style="font-size:9px;fill:var(--ink)">${v.toLocaleString('en-US', {minimumFractionDigits: dp, maximumFractionDigits: dp})}</text>`;
    });
  });
  return `<div class="card chart"><h3>${esc(title)} <span class="u">${unit}</span></h3><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(title)}">${g}</svg>${series.length > 1 ? legend(series) : ''}</div>`;
}

function lineChart(title, series, periods) {
  const all = series.flatMap(s => s.values).filter(v => v != null);
  const sc = niceScale(Math.min(...all), Math.max(...all));
  const f = frame(periods, sc, v => v.toFixed(sc.step < 1 ? 1 : 0) + '%');
  let g = f.g;
  series.forEach(s => {
    const pts = s.values.map((v, i) => v == null ? null : [f.x(i), f.y(v), v]).filter(Boolean);
    g += `<polyline fill="none" stroke="${s.color}" stroke-width="2.2" stroke-linejoin="round" points="${pts.map(p => p[0] + ',' + p[1]).join(' ')}"/>`;
    pts.forEach(p => { g += `<circle cx="${p[0]}" cy="${p[1]}" r="3.2" fill="${s.color}"><title>${esc(s.name)}: ${p[2].toFixed(1)}%</title></circle><text x="${p[0]}" y="${p[1] - 7}" text-anchor="middle" style="font-size:8.5px;fill:var(--ink)">${p[2].toFixed(1)}</text>`; });
  });
  return `<div class="card chart"><h3>${esc(title)}</h3><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(title)}">${g}</svg>${series.length > 1 ? legend(series) : ''}</div>`;
}

function seasonChart(L) {
  const byYear = {};
  L.forEach(r => { const y = r.period_end.slice(0, 4); (byYear[y] = byYear[y] || {})[r.period.slice(0, 2)] = r.revenue; });
  const years = Object.keys(byYear).filter(y => ['Q1', 'Q2', 'Q3', 'Q4'].every(q => byYear[y][q] != null)).sort();
  if (!years.length) return `<div class="card chart"><h3>SEASONAL SALE (%)</h3><div class="empty">ต้องมีรายได้ครบ Q1–Q4 ของปีเดียวกัน</div></div>`;
  const yr = years[years.length - 1], d = byYear[yr], qs = ['Q1', 'Q2', 'Q3', 'Q4'], tot = qs.reduce((s, q) => s + d[q], 0);
  const cols = ['var(--bar)', 'var(--bar2)', '#8a8f9a', '#e2b52b'];
  let a0 = -Math.PI / 2, g = '';
  const cx = 95, cy = 95, R = 78, r = 42;
  qs.forEach((q, k) => {
    const a1 = a0 + d[q] / tot * 2 * Math.PI, big = a1 - a0 > Math.PI ? 1 : 0;
    const p = (a, rr) => `${cx + rr * Math.cos(a)},${cy + rr * Math.sin(a)}`;
    g += `<path d="M${p(a0, R)} A${R},${R} 0 ${big} 1 ${p(a1, R)} L${p(a1, r)} A${r},${r} 0 ${big} 0 ${p(a0, r)}Z" fill="${cols[k]}"><title>${q}/${yr}: ${(d[q] / tot * 100).toFixed(1)}% (${(d[q] / 1000).toLocaleString('en-US', {maximumFractionDigits: 0})} ล้านบาท)</title></path>`;
    const am = (a0 + a1) / 2; g += `<text x="${cx + 60 * Math.cos(am)}" y="${cy + 60 * Math.sin(am) + 4}" text-anchor="middle" style="fill:#fff;font-weight:700;font-size:12px">${(d[q] / tot * 100).toFixed(0)}%</text>`;
    g += `<rect x="190" y="${58 + k * 30}" width="11" height="11" rx="2" fill="${cols[k]}"/><text x="207" y="${67 + k * 30}" style="font-size:11px;fill:var(--ink)">${q}/${String(yr).slice(2)}  ${(d[q] / 1000).toLocaleString('en-US', {maximumFractionDigits: 0})}</text>`;
    a0 = a1;
  });
  g += `<text x="${cx}" y="${cy + 4}" text-anchor="middle" style="font-size:10px">รายได้ ${yr}</text>`;
  return `<div class="card chart"><h3>SEASONAL SALE (%) · ${yr} <span class="u">ล้านบาท</span></h3><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="สัดส่วนรายได้รายไตรมาส">${g}</svg></div>`;
}

/* ---------- หน้า Detail: ซ้าย = ตัวเลข / ขวา = กราฟ ---------- */
function renderDetail(sym) {
  const a = analyse(sym), L = a.list, per = L.map(r => r.period), m = a.m;
  document.getElementById('title').textContent = `${sym} · ${a.cur.name}`;
  document.getElementById('subtitle').textContent = `${a.cur.sector} · งบล่าสุด ${a.cur.period} · ข้อมูลที่มี ${per.length} ไตรมาส (${per.join(', ')}) · หน่วยล้านบาท · เอาเมาส์ชี้ตัวเลขในตารางเพื่อดูสูตรและที่มา`;
  app.innerHTML = '';
  app.appendChild(navBar(sym, 'detail'));

  // สรุปสำหรับผู้บริหาร (กระชับ)
  const b1 = `รายได้ <b class="${cls(m.revY)}">${fp(m.revY)}</b> YoY / <b class="${cls(m.revQ)}">${fp(m.revQ)}</b> QoQ · กำไรสุทธิ <b class="${cls(m.npY)}">${fp(m.npY)}</b> YoY / <b class="${cls(m.npQ)}">${fp(m.npQ)}</b> QoQ (${fmt(a.cur.net_profit)} ล้านบาท)`;
  const b2 = (a.py ? `ต่อกำไร YoY: ${drivers(a.cur, a.py, 2)} ล้านบาท` : '') + (a.pq ? ` · ต่อกำไร QoQ: ${drivers(a.cur, a.pq, 2)} ล้านบาท` : '');
  const adjParts = [];
  [['ล้านบาท', 0, a.cur.net_profit / 1000], ['ล้านเหรียญสหรัฐ', 2, null]].forEach(([unit, dp, repBaht]) => {
    const c = adjOf(sym, a.cur.period, unit); if (!c) return;
    const pv = x => x ? parseFloat(x.adj_net_profit_mb) : null, cv = pv(c);
    const yv = a.py ? pv(adjOf(sym, a.py.period, unit)) : null, qv = a.pq ? pv(adjOf(sym, a.pq.period, unit)) : null;
    const rep = c.reported_unit !== undefined && c.reported_unit !== '' ? parseFloat(c.reported_unit) : repBaht;
    const f = v => v.toLocaleString('en-US', {minimumFractionDigits: dp, maximumFractionDigits: dp});
    adjParts.push(`กำไรสุทธิปรับปรุง ${c.definition.startsWith('คำนวณเอง') ? '(คำนวณเอง ไม่ใช่ตัวเลขของบริษัท: ไม่รวมกำไร/ขาดทุน FX)' : '(นิยามบริษัท)'} ${f(cv)} ${unit} เทียบที่รายงาน ${f(rep)} · YoY ${fp(yv != null && yv > 0 ? (cv - yv) / yv * 100 : null)} · QoQ ${fp(qv != null && qv > 0 ? (cv - qv) / qv * 100 : null)}`);
  });
  const adjNoneRow = adjNone(sym);
  const adjTxt = adjParts.length ? adjParts.join(' · ') : (adjNoneRow ? `ไม่มีตัวเลข: ${adjNoneRow.definition}` : '');
  const b3 = a.ex ? `${esc(a.ex.note)} <span class="sub">[${esc(a.ex.source_doc)} หน้า ${esc(a.ex.page)}]</span>` : 'ยังไม่มีสรุปจาก MD&amp;A';
  const exec = el('div', 'card exec',
    `<h2><span class="badge ${a.verdict[1]}">${a.verdict[0]}</span> สรุปสำหรับผู้บริหาร · ${esc(a.cur.period)}</h2><ul>` +
    `<li><b>ผลลัพธ์:</b> ${b1}</li><li><b>ปัจจัยจากงบ (ล้านบาท):</b> ${esc(b2)}</li><li><b>เหตุผลจาก MD&amp;A:</b> ${b3}</li>` + (adjTxt ? `<li><b>กำไรปรับปรุง:</b> ${esc(adjTxt)}</li>` : '') +
    (a.cautions.length ? `<li><b>ข้อควรระวัง:</b> ${a.cautions.map(esc).join(' · ')}</li>` : '') + `</ul>`);
  app.appendChild(exec);

  const k = (l, v, p, q) => `<div class="card kpi"><div class="sub">${l}</div><div class="v">${fmt(v)}</div><div class="${cls(p)}">YoY ${fp(p)}</div><div class="${cls(q)}">QoQ ${fp(q)}</div></div>`;
  const P = f => ({y: a.py && pct(f(a.cur), f(a.py)), q: a.pq && pct(f(a.cur), f(a.pq))});
  const kp = [['รายได้', r => r.revenue], ['กำไรขั้นต้น', r => r.gross_profit], ['SG&A', sga], ['กำไรสุทธิ', r => r.net_profit]];
  app.appendChild(el('div', 'kpis', kp.map(([l, f]) => k(l, f(a.cur), P(f).y, P(f).q)).join('')));

  const grid = el('div', 'detail');
  const left = el('div', 'nums');
  const dec = Math.max(...L.map(r => r.revenue)) / 1000 >= 10000 ? 0 : 1;  // หุ้นใหญ่แสดงเต็มล้านบาท ให้ตารางไม่กว้างเกินจอ
  const mnote = a.cur.mapping_note || '';  // หมายเหตุการจับคู่บรรทัดงบ (เช่น หุ้นเดินเรือ)
  const n1 = v => (v / 1000).toLocaleString('en-US', {minimumFractionDigits: 1, maximumFractionDigits: 1});
  const q4 = r => r.basis.startsWith('คำนวณ');
  const th = extra => `<tr><th>ล้านบาท</th>${L.map(r => `<th title="${esc(r.period + ' · สิ้นสุด ' + r.period_end + ' · ' + (q4(r) ? 'Q4 ไม่มีงบ 3 เดือน คำนวณจาก ' : 'ที่มา ') + r.source_doc + ' · ดึงเมื่อ ' + r.fetched_date)}">${esc(r.period)}${q4(r) ? '*' : ''}</th>`).join('')}${extra}</tr>`;
  const T = s => ` title="${esc(s)}"`;
  const signed = (v, d = 1) => (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v).toFixed(d);
  // %การเปลี่ยนแปลง: ฐานเปรียบเทียบ ≤ 0 ไม่มีความหมาย แสดง n/m
  const chg = (c, p) => (p == null || p <= 0) ? null : (c - p) / p * 100;
  const chgTip = (lab, cr, pr, f) => {
    if (!pr) return ` title="ไม่มีไตรมาสเปรียบเทียบในข้อมูล"`;
    const c = f(cr), p = f(pr);
    if (p <= 0) return T(`${lab}: ฐานเปรียบเทียบ (${pr.period}) = ${n1(p)} ≤ 0 จึงไม่แสดง % (n/m)`);
    return T(`%${lab} = (${cr.period} − ${pr.period}) ÷ ${pr.period} = (${n1(c)} − ${n1(p)}) ÷ ${n1(p)} = ${fp((c - p) / p * 100)}`);
  };
  // line(ชื่อ, ฟังก์ชันค่า, ตัวหนา, ฟังก์ชันสูตรของเซลล์ (ถ้าเป็นค่าที่คำนวณเอง))
  const line = (label, f, bold, how, note) => {
    const yo = a.py && chg(f(a.cur), f(a.py)), qo = a.pq && chg(f(a.cur), f(a.pq));
    const cell = r => `<td${T(how ? how(r) : `${label} ${r.period} = ${n1(f(r))} ล้านบาท · ${note ? note + ' · ' : ''}ที่มา ${r.source_doc}`)}>${fmt(f(r), dec)}</td>`;
    return `<tr class="${bold ? 't' : ''}"><td>${label}</td>${L.map(cell).join('')}<td class="${cls(yo)}"${chgTip(label, a.cur, a.py, f)}>${yo == null ? 'n/m' : fp(yo)}</td><td class="${cls(qo)}"${chgTip(label, a.cur, a.pq, f)}>${qo == null ? 'n/m' : fp(qo)}</td></tr>`;
  };
  // key metrics: [ชื่อ, ชื่อตัวตั้ง, ตัวตั้ง, ชื่อตัวหาร, ตัวหาร] ตัวหาร ≤ 0 ไม่แสดง (n/m)
  const metricRows = [
    ['GPM', 'กำไรขั้นต้น', r => r.gross_profit, 'รายได้ (SALE)', r => r.revenue],
    ['%EBIT', 'EBIT', r => r.ebit, 'รายได้ (SALE)', r => r.revenue],
    ['NPM', 'กำไรสุทธิ', r => r.net_profit, 'รายได้ (SALE)', r => r.revenue],
    ['SG&A %', 'SG&A (ขาย + บริหาร)', sga, 'รายได้ (SALE)', r => r.revenue],
    ['%SELLING', 'ค่าใช้จ่ายขาย', r => r.selling, 'รายได้ (SALE)', r => r.revenue],
    ['%ADMIN', 'ค่าใช้จ่ายบริหาร', r => r.admin, 'รายได้ (SALE)', r => r.revenue],
    ['%INTEREST/EBIT', 'ต้นทุนทางการเงิน', r => r.finance_cost, 'EBIT', r => r.ebit],
    ['%TAX/EBT', 'ภาษีเงินได้', r => r.tax, 'กำไรก่อนภาษี (EBT)', r => r.ebt],
  ];
  // กำไรสุทธิปรับปรุง (นิยามของบริษัท จาก MD&A) แสดงทุกหุ้นเสมอ: มีตัวเลขเต็ม = แสดงค่า, สกุลอื่นที่ไม่ใช่บาท = แยกบรรทัดตามสกุล, ไม่เปิดเผย = – พร้อมเหตุผล
  const adjRow = (unit, label, dp) => {
    const val = r => { const x = adjOf(sym, r.period, unit); return x ? parseFloat(x.adj_net_profit_mb) : null; };
    const fmtv = v => v.toLocaleString('en-US', {minimumFractionDigits: dp, maximumFractionDigits: dp});
    const ch = (cr, pr, lab) => {
      const c = val(cr), p = pr && val(pr);
      if (!pr || c == null || p == null) return `<td${T(`%${lab}: ไม่มีตัวเลขกำไรปรับปรุงของ ${!pr ? 'ไตรมาสเปรียบเทียบ' : (c == null ? cr.period : pr.period)}`)}>–</td>`;
      const v = p > 0 ? (c - p) / p * 100 : null;
      return `<td class="${cls(v)}"${T(`%${lab} กำไรปรับปรุง = (${cr.period} − ${pr.period}) ÷ ${pr.period} = (${fmtv(c)} − ${fmtv(p)}) ÷ ${fmtv(p)} = ${fp(v)} (คำนวณจากตัวเลขกำไรปรับปรุงในแถวนี้ ซึ่งปัดเป็นหน่วยเต็ม อาจต่างจาก % ที่บริษัทรายงาน ±0.1)`)}>${v == null ? 'n/m' : fp(v)}</td>`;
    };
    const cell = r => {
      const x = adjOf(sym, r.period, unit), v = val(r);
      if (v == null) {
        const none = adjNone(sym);
        return `<td${T(none ? `${r.period}: ${none.definition} · ไม่มีตัวเลขของไตรมาสนี้ใน MD&A ที่มี จึงยังไม่แสดง` : `${r.period}: ยังไม่มีตัวเลขกำไรปรับปรุงที่ระบุเต็มจำนวนใน MD&A ไม่แสดงเพื่อไม่ให้เดา`)}>–</td>`;
      }
      const rep = x.reported_unit !== undefined && x.reported_unit !== '' ? parseFloat(x.reported_unit) : r.net_profit / 1000;
      const diff = v - rep;
      return `<td${T(`กำไรสุทธิปรับปรุง ${r.period} = ${fmtv(v)} ${unit} · กำไรที่รายงาน (หน่วยเดียวกัน) ${fmtv(rep)} → ส่วนต่าง ${diff >= 0 ? '+' : '−'}${fmtv(Math.abs(diff))} · ${x.definition} · ที่มา ${x.source_doc} หน้า ${x.page}`)}>${fmtv(v)}</td>`;
    };
    const selfCalc = adjRows.some(x => x.symbol === sym && adjUnit(x) === unit && x.adj_net_profit_mb !== '' && x.definition.startsWith('คำนวณเอง'));
    return `<tr class="t adj"><td>${label}${selfCalc ? ' [คำนวณเอง]' : ''}</td>${L.map(cell).join('')}${ch(a.cur, a.py, 'YoY')}${ch(a.cur, a.pq, 'QoQ')}</tr>`;
  };
  const adjLine = () => {
    let out = '';
    if (hasAdj(sym, 'ล้านบาท') || adjNone(sym)) out += adjRow('ล้านบาท', 'NET PROFIT (ปรับปรุง)²', 0);
    if (hasAdj(sym, 'ล้านเหรียญสหรัฐ')) out += adjRow('ล้านเหรียญสหรัฐ', 'NET PROFIT (ปรับปรุง) USD²', 2);
    return out;
  };
  const mval = (m, r) => m[4](r) > 0 ? m[2](r) / m[4](r) * 100 : null;
  const mtip = (m, r) => {
    const num = m[2](r), den = m[4](r);
    if (den <= 0) return T(`${m[0]} ${r.period}: ตัวหาร ${m[3]} = ${n1(den)} ≤ 0 จึงไม่แสดงอัตราส่วน (n/m)`);
    return T(`${m[0]} ${r.period} = ${m[1]} ÷ ${m[3]} × 100 = ${n1(num)} ÷ ${n1(den)} × 100 = ${(num / den * 100).toFixed(1)}%`);
  };
  const dtip = (m, cr, pr, lab) => {
    if (!pr) return ` title="ไม่มีไตรมาสเปรียบเทียบในข้อมูล"`;
    const c = mval(m, cr), p = mval(m, pr);
    if (c == null || p == null) return T(`${m[0]}: ตัวหารของ ${c == null ? cr.period : pr.period} ≤ 0 จึงเทียบไม่ได้ (n/m)`);
    return T(`${lab}: ${cr.period} − ${pr.period} = ${c.toFixed(1)}% − ${p.toFixed(1)}% = ${signed(c - p)} จุดเปอร์เซ็นต์`);
  };
  const dcell = (m, cr, pr) => {
    if (!pr) return '–';
    const c = mval(m, cr), p = mval(m, pr);
    return (c == null || p == null) ? 'n/m' : (Math.abs(c - p) < 0.05 ? '0.0' : signed(c - p));
  };
  const dcls = (m, cr, pr) => { if (!pr) return ''; const c = mval(m, cr), p = mval(m, pr); return (c == null || p == null || Math.abs(c - p) < 0.05) ? '' : cls(c - p); };
  // ตัวเลขต่อหุ้น: Revenue per Share, EPS, DPS (แยกจาก P&L และ Key Metrics)
  const psOf = r => psRows.find(x => x.symbol === sym && x.period === r.period);
  const dvOf = r => divRows.find(x => x.symbol === sym && x.period === r.period);
  const rpsV = r => { const p = psOf(r); const sh = p ? parseFloat(p.shares_mn) : NaN; return isFinite(sh) && sh > 0 ? r.revenue / 1000 / sh : null; };
  const epsV = r => { const p = psOf(r); return p ? parseFloat(p.eps) : null; };
  const dpsV = r => { const d = dvOf(r); return d && d.dps !== '' ? parseFloat(d.dps) : null; };
  const psTip = {
    rps: r => { const p = psOf(r); return `Revenue per Share ${r.period} = SALE ÷ จำนวนหุ้น = ${n1(r.revenue)} ล้านบาท ÷ ${parseFloat(p.shares_mn).toLocaleString('en-US', {minimumFractionDigits: 1})} ล้านหุ้น = ${rpsV(r).toFixed(2)} บาท · ที่มาจำนวนหุ้น: ${p.shares_basis}`; },
    eps: r => { const p = psOf(r), sh = parseFloat(p.shares_mn), im = parseFloat(p.eps_implied_shares_mn);
      const dev = im && isFinite(sh) ? (im - sh) / sh * 100 : 0;
      return `EPS ${r.period} = ${parseFloat(p.eps).toFixed(5)} บาท (กำไรต่อหุ้นขั้นพื้นฐานที่บริษัทรายงาน) · ${p.basis} · ที่มา ${p.source_doc}` +
        (Math.abs(dev) > 0.5 && !String(p.basis).includes('ปัด') ? ` · หมายเหตุ: EPS ที่บริษัทรายงานต่ำ/สูงกว่า กำไรสุทธิ ÷ จำนวนหุ้นประมาณ ${Math.abs(dev).toFixed(1)}% (ไม่ได้ตรวจสาเหตุ ตัวเลขนี้คือค่าที่บริษัทรายงาน)` : ''); },
    dps: r => { const d = dvOf(r); return `DPS ${r.period} = ${parseFloat(d.dps).toFixed(2)} บาทต่อหุ้น · ${d.event}${d.note ? ' · ' + d.note : ''} · ที่มา ${d.source_doc} · ผูกกับผลงวดที่ประกาศพร้อมงบ`; },
  };
  const psRow = (label, f, dp, kind) => {
    const zero = (x, y) => kind === 'dps' && (x === 0 || y === 0);   // ปันผลเป็นศูนย์ในงวดใดงวดหนึ่ง เทียบ % ไม่มีความหมาย
    const yo = a.py && f(a.py) != null && f(a.cur) != null && !zero(f(a.cur), f(a.py)) ? chg(f(a.cur), f(a.py)) : null, qo = a.pq && f(a.pq) != null && f(a.cur) != null && !zero(f(a.cur), f(a.pq)) ? chg(f(a.cur), f(a.pq)) : null;
    const cell = r => { const v = f(r); return v == null
      ? `<td${T(kind === 'dps' ? `${r.period}: ยังไม่ได้ตรวจเอกสารปันผลของไตรมาสนี้ จึงไม่แสดง` : `${r.period}: ไม่มีข้อมูลต่อหุ้นของไตรมาสนี้`)}>–</td>`
      : `<td${T(psTip[kind](r))}>${v.toFixed(kind === 'eps' ? Math.min(dp, parseInt(psOf(r).eps_dp || dp)) : dp)}</td>`; };
    const tipCh = (pr, lab) => !pr ? ' title="ไม่มีไตรมาสเปรียบเทียบ"' : (f(pr) == null || f(a.cur) == null) ? T(`%${lab}: ไม่มีตัวเลขของไตรมาสเปรียบเทียบ`)
      : zero(f(a.cur), f(pr)) ? T(`%${lab}: ปันผลเป็น 0 ในงวดใดงวดหนึ่ง (ไม่มีการประกาศ) เทียบ % ไม่มีความหมาย (n/m)`)
      : f(pr) <= 0 ? T(`%${lab}: ฐานเปรียบเทียบ (${pr.period}) = ${f(pr).toFixed(dp)} ≤ 0 จึงไม่แสดง % (n/m)`)
      : T(`%${lab} ${label} = (${a.cur.period} − ${pr.period}) ÷ ${pr.period} = (${f(a.cur).toFixed(dp)} − ${f(pr).toFixed(dp)}) ÷ ${f(pr).toFixed(dp)} = ${fp((f(a.cur) - f(pr)) / f(pr) * 100)}`);
    const show = (v, pr) => !pr || f(pr) == null || f(a.cur) == null ? '–' : (v == null ? 'n/m' : fp(v));
    return `<tr><td>${label}</td>${L.map(cell).join('')}<td class="${cls(yo)}"${tipCh(a.py, 'YoY')}>${show(yo, a.py)}</td><td class="${cls(qo)}"${tipCh(a.pq, 'QoQ')}>${show(qo, a.pq)}</td></tr>`;
  };
  const psCard = () => psRows.some(x => x.symbol === sym)
    ? `<div class="card tw"><table>${th('<th>%YoY</th><th>%QoQ</th>').replace('ล้านบาท', 'บาทต่อหุ้น')}` +
      psRow('REVENUE/SHARE', rpsV, 2, 'rps') + psRow('EPS', epsV, 3, 'eps') + psRow('DPS', dpsV, 2, 'dps') + `</table></div>` : '';
  left.innerHTML =
    `<div class="card tw"><table>${th('<th>%YoY</th><th>%QoQ</th>')}` +
    line('SALE', r => r.revenue, true) + line('COGS', r => r.cogs, false, null, mnote) + line('GROSS PROFIT', r => r.gross_profit, true, null, mnote) +
    line('SELLING', r => r.selling) + line('ADMIN', r => r.admin, false, null, mnote) +
    line('SG&A', sga, true, r => `SG&A ${r.period} = ค่าใช้จ่ายขาย + ค่าใช้จ่ายบริหาร = ${n1(r.selling)} + ${n1(r.admin)} = ${n1(sga(r))} ล้านบาท (คำนวณเอง)`) +
    line('EBIT¹', r => r.ebit, true, r => `EBIT ${r.period} = กำไรก่อนภาษี (EBT) + ต้นทุนทางการเงิน = ${n1(r.ebt)} + ${n1(r.finance_cost)} = ${n1(r.ebit)} ล้านบาท (คำนวณเอง บริษัทไม่ได้รายงาน)`) +
    line('INTEREST', r => r.finance_cost, false, null, 'ต้นทุนทางการเงิน') + line('EBT', r => r.ebt, true, null, 'กำไรก่อนภาษีเงินได้') +
    line('TAX', r => r.tax, false, null, 'ภาษีเงินได้ (บวก = ค่าใช้จ่าย ลบ = รายได้ภาษี)') + line('NET PROFIT', r => r.net_profit, true, null, 'กำไรส่วนที่เป็นของบริษัทใหญ่') + adjLine() + `</table></div>` + psCard() +
    `<div class="card tw"><table>${th('<th>YoY (จุด)</th><th>QoQ (จุด)</th>')}` +
    metricRows.map(m => {
      return `<tr><td>${m[0]}</td>${L.map(r => `<td${mtip(m, r).replace(/^ /, ' ')}>${fr(mval(m, r)).replace('–', 'n/m')}</td>`).join('')}` +
        `<td class="${dcls(m, a.cur, a.py)}"${dtip(m, a.cur, a.py, 'YoY')}>${dcell(m, a.cur, a.py)}</td><td class="${dcls(m, a.cur, a.pq)}"${dtip(m, a.cur, a.pq, 'QoQ')}>${dcell(m, a.cur, a.pq)}</td></tr>`;
    }).join('') + `</table></div>` +
    `<div class="card"><details><summary>ที่มาของตัวเลขและสรุปจาก MD&amp;A</summary><ul>` +
    [...new Set(L.map(r => r.source_doc + ' · ดึงเมื่อ ' + r.fetched_date))].map(s => `<li>${esc(s)}</li>`).join('') +
    `<li><a href="${esc(a.cur.source_url)}" target="_blank" rel="noopener">หน้าข่าวหลักทรัพย์ SET</a> (ค้นหาข่าวงบของ ${esc(sym)})</li>` +
    notes.filter(n => n.symbol === sym && n.topic !== 'สรุปผู้บริหาร').map(n => `<li><b>${esc(n.topic)} (${esc(n.period)}):</b> ${esc(n.note)} [${esc(n.source_doc)} หน้า ${esc(n.page)}]</li>`).join('') +
    `</ul><div class="sub" style="margin-top:6px">³ ตัวเลขต่อหุ้น: REVENUE/SHARE = SALE ÷ จำนวนหุ้น, EPS = ค่าที่บริษัทรายงาน, DPS = ปันผลต่อหุ้นที่ประกาศพร้อมผลงวดนั้น (ปันผลประจำปีผูกกับไตรมาส 4) ช่อง – = ยังไม่มีเอกสารยืนยัน ชี้เมาส์ดูสูตรและที่มา · ² กำไรสุทธิปรับปรุง เป็นตัวเลขที่บริษัทเปิดเผยใน MD&A ตามนิยามของตนเอง (ITC ตัดค่าใช้จ่ายโครงการ Transformation, TRUE ตัดผลกระทบครั้งเดียวที่ไม่ใช่เงินสด) นิยามไม่เหมือนกันจึงเทียบข้ามหุ้นไม่ได้ ช่อง – = ยังไม่มีตัวเลขเต็มจำนวน · ¹ EBIT = กำไรก่อนภาษี + ต้นทุนการเงิน คำนวณเองจากงบ (รวมรายได้อื่นและส่วนแบ่งกำไร) · * Q4 ไม่มีงบ 3 เดือน คำนวณจากงบทั้งปี − งบ 9 เดือน (กำไรสุทธิตรงกับ F45) · sector: ${esc(a.cur.sector_source)}</div></details></div>`;

  const right = el('div', 'charts');
  right.innerHTML =
    barChart('SALE', [{name: 'รายได้', values: L.map(r => r.revenue), color: 'var(--bar)'}], per) +
    barChart('GROSS PROFIT', [{name: 'กำไรขั้นต้น', values: L.map(r => r.gross_profit), color: 'var(--bar)'}], per) +
    barChart('SG&A', [{name: 'ขาย', values: L.map(r => r.selling), color: 'var(--bar)'}, {name: 'บริหาร', values: L.map(r => r.admin), color: 'var(--bar2)'}], per) +
    barChart('NET PROFIT', [{name: 'กำไรสุทธิ', values: L.map(r => r.net_profit), color: 'var(--bar)'}], per) +
    seasonChart(L) +
    lineChart('GPM (%)', [{name: 'GPM', values: L.map(r => ratio(r.gross_profit, r.revenue)), color: 'var(--bar)'}], per) +
    lineChart('SG&A (%)', [{name: '%Selling', values: L.map(r => ratio(r.selling, r.revenue)), color: 'var(--bar)'}, {name: '%Admin', values: L.map(r => ratio(r.admin, r.revenue)), color: 'var(--bar2)'}], per) +
    lineChart('NPM (%)', [{name: 'NPM', values: L.map(r => ratio(r.net_profit, r.revenue)), color: 'var(--bar)'}], per);
  grid.appendChild(left); grid.appendChild(right);
  app.appendChild(grid);
}

/* ---------- หน้า 3: Earning call ---------- */
function navBar(sym, active) {
  const w = el('div', 'controls');
  const back = el('button', 'btn', '← กลับหน้าสรุป'); back.type = 'button'; back.onclick = () => { location.hash = '#/'; };
  w.appendChild(back);
  const tabs = el('div', 'tabs');
  [['detail', 'งบการเงิน', '#/' + sym], ['call', 'Earning call', '#/call/' + sym]].forEach(([k, l, h]) => {
    const b = el('button', 'tab' + (k === active ? ' on' : ''), esc(l)); b.type = 'button'; b.onclick = () => { location.hash = h; }; tabs.appendChild(b);
  });
  w.appendChild(tabs);
  return w;
}
const secOf = tm => { const p = String(tm).split(':').map(Number); return p.length === 3 ? p[0] * 3600 + p[1] * 60 + p[2] : p[0] * 60 + p[1]; };
const tlink = (call, tm) => !tm ? '' : (/youtube\.com|youtu\.be/.test(call.url)
  ? `<a href="${esc(call.url)}&amp;t=${secOf(tm)}s" target="_blank" rel="noopener" title="เปิดวิดีโอที่นาที ${esc(tm)}">▶ ${esc(tm)}</a>`
  : `<span class="sub">${esc(tm)}</span>`);
const CHG = {'ลด': 'b-down', 'เพิ่ม': 'b-up', 'ใหม่': 'b-mix', 'คงเดิม': 'b-warn'};

function renderCall(sym) {
  const a = analyse(sym), c = callOf(sym);
  document.getElementById('title').textContent = `${sym} · Earning call`;
  app.innerHTML = '';
  app.appendChild(navBar(sym, 'call'));
  if (!c) {
    document.getElementById('subtitle').textContent = `${a.cur.name} · ยังไม่มีข้อมูล earning call ในระบบ`;
    app.appendChild(el('div', 'card', `<h2>ยังไม่มีสรุป earning call ของ ${esc(sym)}</h2><div>ต้องดาวน์โหลดเอกสารมาไว้ที่ <code>data/raw/</code> ก่อน แล้วให้ผู้ช่วยสรุป:</div><ul>` +
      `<li><b>จำเป็น:</b> transcript ฉบับเต็มของ earning call / Opportunity Day งวด ${esc(a.cur.period)} (มีช่วง Q&amp;A) ตั้งชื่อ <code>${esc(sym)}_Q3-2026_CALL.pdf</code> (หรือ .docx / .md)</li>` +
      `<li><b>แนะนำ:</b> สไลด์ที่นำเสนอ <code>${esc(sym)}_Q3-2026_SLIDES.pdf</code> และ transcript ไตรมาสก่อน เพื่อเทียบการเปลี่ยน guidance</li>` +
      `<li><b>จำเป็น:</b> จดลิงก์ต้นทางและวันที่ลง <code>output/earning_call_sources.csv</code></li></ul>`));
    return;
  }
  const call = c.call;
  const allCalls = callsOf(sym);
  if (allCalls.length > 1) {
    const w = el('div', 'controls'); w.appendChild(el('span', 'sub', 'เลือก call:'));
    const sel = el('select'); sel.setAttribute('aria-label', 'เลือก earning call');
    allCalls.forEach((x, i) => { const o = el('option', null, esc(x.period + (i === 0 ? ' (ล่าสุด)' : '') + ' · ' + x.call.published)); o.value = x.period; if (x.period === c.period) o.selected = true; sel.appendChild(o); });
    sel.onchange = () => { callPick[sym] = sel.value; renderCall(sym); };
    w.appendChild(sel); app.appendChild(w);
  }
  document.getElementById('subtitle').textContent = `${a.cur.name} · ${call.title} · เผยแพร่ ${call.published}`;
  const sameP = c.period === a.cur.period;
  const head = el('div', 'card', `<h2><span class="badge ${esc(c.verdict.badge)}">${esc(c.verdict.label)}</span> สรุป earning call ${esc(c.period)}</h2>` +
    `<div>${esc(c.verdict.summary)}</div>` +
    `<div class="tw" style="padding:6px 0 0"><table class="gt"><tr><th>ส่วน</th><th>ป้าย</th><th>เหตุผล</th><th>ฟัง</th></tr>` +
    c.verdict.parts.map(p => `<tr><td>${esc(p.name)}</td><td><span class="badge ${esc(p.badge)}">${esc(p.label)}</span></td><td>${esc(p.why)}</td><td>${tlink(call, p.t)}</td></tr>`).join('') + `</table></div>` +
    `<div class="sub" style="margin-top:6px">ที่มา: <a href="${esc(call.url)}" target="_blank" rel="noopener">${esc(call.title)}</a> · ${esc(call.kind)}${sameP ? '' : ' · <b>งวดของ call ไม่ตรงกับงบล่าสุด ' + esc(a.cur.period) + '</b>'}</div>`);

  const gsec = el('div', 'card', `<h2>ไกด์ไลน์ที่ผู้บริหารให้</h2><div class="tw" style="padding:0"><table class="gt"><tr><th>รายการ</th><th>ค่า</th><th>เทียบงวดก่อน</th><th>หมายเหตุ</th><th>ที่มา</th></tr>` +
    c.guidance.map(g => `<tr><td>${esc(g.item)}</td><td><b>${esc(g.value)}</b></td><td><span class="chg ${CHG[g.change] || 'b-warn'}">${esc(g.change)}</span></td><td>${esc(g.note)}</td><td class="sub">${esc(g.source)}</td></tr>`).join('') + `</table></div>`);

  const hl = el('div', 'card', `<h2>ประเด็นสำคัญจากการนำเสนอ</h2><ul style="margin:0;padding-left:18px">` +
    c.highlights.map(h => `<li>${esc(h.text)} ${tlink(call, h.t)}</li>`).join('') + `</ul>`);

  const fm = a.m;
  const fin = el('div', 'card', `<h2><span class="badge ${a.verdict[1]}">${a.verdict[0]}</span> งบล่าสุด ${esc(a.cur.period)} ดีหรือแย่อย่างไร</h2>` +
    `<div>รายได้ <b class="${cls(fm.revY)}">${fp(fm.revY)}</b> YoY / <b class="${cls(fm.revQ)}">${fp(fm.revQ)}</b> QoQ · กำไรสุทธิ <b class="${cls(fm.npY)}">${fp(fm.npY)}</b> YoY / <b class="${cls(fm.npQ)}">${fp(fm.npQ)}</b> QoQ (ตัวเลขจากตารางหน้า "งบการเงิน" ใช้ยอดที่รายงาน)</div>` +
    `<ul style="margin:6px 0 0;padding-left:18px">${c.financial_view.points.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` +
    `<div class="sub" style="margin-top:6px"><a href="#/${esc(sym)}">ดูตารางงบและกราฟทั้งหมด ›</a></div>`);

  const qa = c.qa, topics = [...new Set(qa.map(x => x.topic))];
  const qbox = el('div', 'card qa');
  qbox.innerHTML = `<h2>คำถาม-คำตอบทั้งหมด <span class="sub" id="qacnt"></span></h2><div class="sub">สรุปด้วยคำของเรา ไม่ใช่ข้อความถอดคำต่อคำ กด ▶ เพื่อฟังเสียงจริงตรงนาทีนั้น · transcript มี ${esc(call.transcript_questions)} คำถาม</div>`;
  const bar = el('div', 'controls');
  const si = el('input'); si.type = 'search'; si.placeholder = 'ค้นหาในคำถาม/คำตอบ';
  const ts = el('select'); ts.setAttribute('aria-label', 'หัวข้อ');
  [['', 'ทุกหัวข้อ'], ...topics.map(x => [x, x])].forEach(([v, l]) => { const o = el('option', null, esc(l)); o.value = v; ts.appendChild(o); });
  bar.appendChild(si); bar.appendChild(ts);
  const open = el('button', 'btn', 'เปิด/ปิดทั้งหมด'); open.type = 'button'; bar.appendChild(open);
  qbox.appendChild(bar);
  const list = el('div'); qbox.appendChild(list);
  function drawQA() {
    const kw = si.value.trim().toLowerCase();
    const f = qa.filter(x => (!ts.value || x.topic === ts.value) && (!kw || (x.q + x.a + x.topic).toLowerCase().includes(kw)));
    qbox.querySelector('#qacnt').textContent = `(แสดง ${f.length} / ${qa.length} ข้อ)`;
    list.innerHTML = f.length ? f.map(x => `<details><summary>Q${x.n} · ${esc(x.topic)} <span class="meta">${tlink(call, x.t)}</span></summary><div class="body">` +
      `<p><b>คำถาม</b> <span class="sub">(${esc(x.asker)})</span><br>${esc(x.q)}</p><p><b>คำตอบ</b> <span class="sub">(${esc(x.answerer)})</span><br>${esc(x.a)}</p>` +
      (x.flag ? `<span class="flag">หมายเหตุ: ${esc(x.flag)}</span>` : '') + `</div></details>`).join('') : '<div class="empty">ไม่พบคำถามตามเงื่อนไข</div>';
  }
  si.oninput = drawQA; ts.onchange = drawQA;
  open.onclick = () => { const ds = [...list.querySelectorAll('details')], any = ds.some(d => !d.open); ds.forEach(d => { d.open = any; }); };
  drawQA();

  const cav = el('div', 'card', `<h2>ข้อควรรู้</h2><ul style="margin:0;padding-left:18px">${c.caveats.map(x => `<li>${esc(x)}</li>`).join('')}</ul>`);
  const wrap = el('div', 'stack');
  [head, gsec, fin, hl, qbox, cav].forEach(x => wrap.appendChild(x));
  app.appendChild(wrap);
}

function route() {
  const h = location.hash.replace(/^#\/?/, '');
  if (h.startsWith('call/') && bySym[h.slice(5)]) renderCall(h.slice(5));
  else if (h && bySym[h]) renderDetail(h); else renderSummary();
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
document.getElementById('theme').onclick = () => {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme:dark)').matches;
  root.dataset.theme = dark ? 'light' : 'dark';
};
document.getElementById('foot').textContent = 'ข้อมูลจาก F45 / งบการเงิน / MD&A ที่บริษัทแจ้งผ่าน SET · ใช้เพื่อการศึกษา ไม่ใช่คำแนะนำการลงทุน';
route();
</script>
</body>
